
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-registration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-registration
  template:
    metadata:
      labels:
        app: event-registration
    spec:
      containers:
        - name: event-app
          image: event-registration:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: event-registration-service
spec:
  type: NodePort
  selector:
    app: event-registration
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
